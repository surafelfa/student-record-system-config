# API Gateways traditionally run on port 8080, 80, or 443
server.port=8080

# ----------------------------------------
# Eureka Configuration
# ----------------------------------------
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Enable/disable registry fetch (default: true)
eureka.client.fetch-registry=true

# How often to fetch registry from Eureka server (default: 30s)
eureka.client.registry-fetch-interval-seconds=30

# Cache refresh interval (default: 30s)
eureka.client.cache-refresh-executor-thread-pool-size=5

# How often to send heartbeat to Eureka server (default: 30s)
eureka.instance.lease-renewal-interval-in-seconds=30

# How long Eureka server waits before expiring instance (default: 90s)
eureka.instance.lease-expiration-duration-in-seconds=90

# Enable/disable health check (default: true)
eureka.client.healthcheck.enabled=true

# Spring boot admin config - URL will be resolved via Eureka discovery
# spring.boot.admin.client.url=http://localhost:8081

# ----------------------------------------
# Actuator Config
# ----------------------------------------
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=threaddump,heapdump
management.endpoints.web.base-path=/actuator
# Actuator on same port as Gateway - access via http://localhost:8080/actuator/*

# Show full details in the /actuator/health endpoint (e.g., database status, disk space)
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0

management.endpoint.gateway.enabled=true
management.health.circuitbreakers.enabled=true

# ==========================================
# GATEWAY ROUTES
# ==========================================

# Route 1: Forwarding to the Student Service
# The ID is just a unique name you give the route
spring.cloud.gateway.server.webflux.routes[0].id=student-service
# Where the traffic should go (e.g., your student microservice running on 8082)
spring.cloud.gateway.server.webflux.routes[0].uri=lb://studentservice
# The Predicate: "If the URL starts with /students, use this route"
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/students/**
# Filter to strip the prefix
#spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Route 2: Forwarding to a Course Service
spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://courseservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/courses/**

# Route 3: Forwarding to an Enrollment Service
spring.cloud.gateway.server.webflux.routes[2].id=enrollment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://enrollmentservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/enrollments/**

# Route 4: Forwarding to an Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://securityservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm

# Logging
logging.level.com.craft.apigateway=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Gateway Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Resilience4j Circuit Breaker Configuration
# Course Service Circuit Breaker
resilience4j.circuitbreaker.instances.courseServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.courseServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.courseServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.courseServiceCB.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.courseServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.courseServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# Student Service Circuit Breaker
resilience4j.circuitbreaker.instances.studentServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.studentServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.studentServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentServiceCB.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.studentServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.studentServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# Enrollment Service Circuit Breaker
resilience4j.circuitbreaker.instances.enrollmentServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.enrollmentServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.enrollmentServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.enrollmentServiceCB.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.enrollmentServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.enrollmentServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# Security Service Circuit Breaker
resilience4j.circuitbreaker.instances.securityServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.securityServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.securityServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.securityServiceCB.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.securityServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.securityServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# Retry Configuration
resilience4j.retry.instances.gateway.max-attempts=3
resilience4j.retry.instances.gateway.wait-duration=100
resilience4j.retry.instances.gateway.enable-exponential-backoff=true
resilience4j.retry.instances.gateway.exponential-backoff-multiplier=2

# TimeLimiter Configuration
resilience4j.timelimiter.instances.gateway.timeout-duration=5s

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
