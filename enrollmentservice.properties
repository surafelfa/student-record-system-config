# server port
server.port=8084

# ----------------------------------------
# MySQL Database Connection Settings
# ----------------------------------------
# Replace 'your_database_name' with your actual schema name.
spring.datasource.url=jdbc:mysql://localhost:3306/student_record_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Spring Boot usually auto-detects this, but it's good practice to include it
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
# Dialect specifies how Hibernate generates SQL for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' updates the schema automatically. Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Shows the generated SQL in your console (helpful for debugging)
spring.jpa.show-sql=true

# Format the generated SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# Actuator config
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=threaddump,heapdump
management.health.defaults.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=8084

# Show full details in the /actuator/health endpoint (e.g., database status, disk space)
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0


# Spring boot admin config
spring.boot.admin.client.url=http://localhost:8081
spring.boot.admin.client.instance.prefer-ip=true

# Eureka config
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Swagger config
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/swagger-ui

# Logging
logging.level.com.craft.{service-name}=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# External Service URLs (using Eureka logical names)
student.service.url=http://studentservice
course.service.url=http://courseservice

# Resilience4j Configuration for Student Service
resilience4j.circuitbreaker.instances.studentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.studentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.studentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.studentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.studentService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.studentService.max-attempts=3
resilience4j.retry.instances.studentService.wait-duration=1000
resilience4j.retry.instances.studentService.enable-exponential-backoff=true
resilience4j.retry.instances.studentService.exponential-backoff-multiplier=2

resilience4j.timelimiter.instances.studentService.timeout-duration=3s
resilience4j.timelimiter.instances.studentService.cancel-running-future=true

# Resilience4j Configuration for Course Service
resilience4j.circuitbreaker.instances.courseService.register-health-indicator=true
resilience4j.circuitbreaker.instances.courseService.sliding-window-size=10
resilience4j.circuitbreaker.instances.courseService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.courseService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.courseService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.courseService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.courseService.max-attempts=3
resilience4j.retry.instances.courseService.wait-duration=1000
resilience4j.retry.instances.courseService.enable-exponential-backoff=true
resilience4j.retry.instances.courseService.exponential-backoff-multiplier=2

resilience4j.timelimiter.instances.courseService.timeout-duration=3s
resilience4j.timelimiter.instances.courseService.cancel-running-future=true

# Resilience4j Configuration for Enrollment Service
# Circuit Breaker
resilience4j.circuitbreaker.instances.enrollmentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.enrollmentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.enrollmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.enrollmentService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.enrollmentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.enrollmentService.automatic-transition-from-open-to-half-open-enabled=true

# Retry
resilience4j.retry.instances.enrollmentService.max-attempts=3
resilience4j.retry.instances.enrollmentService.wait-duration=1000
resilience4j.retry.instances.enrollmentService.enable-exponential-backoff=true
resilience4j.retry.instances.enrollmentService.exponential-backoff-multiplier=2

# Rate Limiter
resilience4j.ratelimiter.instances.enrollmentService.limit-for-period=10
resilience4j.ratelimiter.instances.enrollmentService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.enrollmentService.timeout-duration=3s
resilience4j.ratelimiter.instances.enrollmentService.register-health-indicator=true

# Bulkhead
resilience4j.bulkhead.instances.enrollmentService.max-concurrent-calls=10
resilience4j.bulkhead.instances.enrollmentService.max-wait-duration=2s
