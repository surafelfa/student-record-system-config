# Server Configuration
server.port=8085

# ----------------------------------------
# MySQL Database Connection Settings
# ----------------------------------------
# Each microservice has its own database (database per service pattern)
spring.datasource.url=jdbc:mysql://localhost:3306/securityservice_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
# Spring Boot usually auto-detects this, but it's good practice to include it
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
# Dialect specifies how Hibernate generates SQL for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' updates the schema automatically. Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Shows the generated SQL in your console (helpful for debugging)
spring.jpa.show-sql=true

# Format the generated SQL for better readability
spring.jpa.properties.hibernate.format_sql=true


# Spring boot admin config - URL will be resolved via Eureka discovery
# spring.boot.admin.client.url=http://localhost:8081

# ----------------------------------------
# Actuator Config
# ----------------------------------------
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=threaddump,heapdump
management.endpoints.web.base-path=/actuator
management.server.port=8085

# Show full details in the /actuator/health endpoint (e.g., database status, disk space)
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Enable/disable registry fetch (default: true)
eureka.client.fetch-registry=true

# How often to fetch registry from Eureka server (default: 30s)
eureka.client.registry-fetch-interval-seconds=30

# Cache refresh interval (default: 30s)
eureka.client.cache-refresh-executor-thread-pool-size=5

# How often to send heartbeat to Eureka server (default: 30s)
eureka.instance.lease-renewal-interval-in-seconds=30

# How long Eureka server waits before expiring instance (default: 90s)
eureka.instance.lease-expiration-duration-in-seconds=90

# Enable/disable health check (default: true)
eureka.client.healthcheck.enabled=true

# Logging
logging.level.com.craft.securityservice=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# Resilience4j Configuration for Security Service
# Circuit Breaker
resilience4j.circuitbreaker.instances.securityService.register-health-indicator=true
resilience4j.circuitbreaker.instances.securityService.sliding-window-size=10
resilience4j.circuitbreaker.instances.securityService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.securityService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.securityService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.securityService.automatic-transition-from-open-to-half-open-enabled=true

# Retry
resilience4j.retry.instances.securityService.max-attempts=3
resilience4j.retry.instances.securityService.wait-duration=1000
resilience4j.retry.instances.securityService.enable-exponential-backoff=true
resilience4j.retry.instances.securityService.exponential-backoff-multiplier=2

# Rate Limiter
resilience4j.ratelimiter.instances.securityService.limit-for-period=10
resilience4j.ratelimiter.instances.securityService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.securityService.timeout-duration=3s
resilience4j.ratelimiter.instances.securityService.register-health-indicator=true

# Bulkhead
resilience4j.bulkhead.instances.securityService.max-concurrent-calls=10
resilience4j.bulkhead.instances.securityService.max-wait-duration=2s

# Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
