# server port
server.port=8081

# ----------------------------------------
# Actuator Config
# ----------------------------------------
# expose actuator endpoints over HTTP (health, info, metrics, env, beans, loggers, etc.)
management.endpoints.web.exposure.include=*
# exclude sensitive endpoints
management.endpoints.web.exposure.exclude=threaddump,heapdump
# base path for actuator endpoints
management.endpoints.web.base-path=/actuator
# run actuator server on a separate management port (recommended for security reasons)
management.server.port=8081
# show full details in the /actuator/health endpoint (e.g., database status, disk space)
management.endpoint.health.show-details=always
# enable environment details in /actuator/info
management.info.env.enabled=true
info.app.name=Student Record System
info.app.version=1.0.0

# Eureka config
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Enable/disable registry fetch (default: true)
eureka.client.fetch-registry=true

# How often to fetch registry from Eureka server (default: 30s)
eureka.client.registry-fetch-interval-seconds=30

# Cache refresh interval (default: 30s)
eureka.client.cache-refresh-executor-thread-pool-size=5

# How often to send heartbeat to Eureka server (default: 30s)
eureka.instance.lease-renewal-interval-in-seconds=30

# How long Eureka server waits before expiring instance (default: 90s)
eureka.instance.lease-expiration-duration-in-seconds=90

# Enable/disable health check (default: true)
eureka.client.healthcheck.enabled=true

