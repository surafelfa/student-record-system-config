# server port
server.port=8082

# ----------------------------------------
# MySQL Database Connection Settings
# ----------------------------------------
# Replace 'your_database_name' with your actual schema name.
spring.datasource.url=jdbc:mysql://localhost:3306/student_record_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Spring Boot usually auto-detects this, but it's good practice to include it
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
# Dialect specifies how Hibernate generates SQL for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' updates the schema automatically. Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Shows the generated SQL in your console (helpful for debugging)
spring.jpa.show-sql=true

#actuator config
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=threaddump,heapdump
management.endpoints.web.base-path=/actuator
management.server.port=8082

# Show full details in the /actuator/health endpoint (e.g., database status, disk space)
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0


#spring boot admin config
spring.boot.admin.client.url=http://localhost:8081

# eureka config
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

