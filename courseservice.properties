# server port
server.port=8083

# ----------------------------------------
# MySQL Database Connection Settings
# ----------------------------------------
# Replace 'your_database_name' with your actual schema name.
spring.datasource.url=jdbc:mysql://localhost:3306/student_record_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Spring Boot usually auto-detects this, but it's good practice to include it
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------
# Dialect specifies how Hibernate generates SQL for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' updates the schema automatically. Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Shows the generated SQL in your console (helpful for debugging)
spring.jpa.show-sql=true

# Format the generated SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# Actuator config
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=threaddump,heapdump
management.endpoints.web.base-path=/actuator
management.server.port=8083

# Show full details in the /actuator/health endpoint (e.g., database status, disk space)
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0


# Spring boot admin config - URL will be resolved via Eureka discovery
# spring.boot.admin.client.url=http://localhost:8081

# Eureka config
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Enable/disable registry fetch (default: true)
eureka.client.fetch-registry=true

# How often to fetch registry from Eureka server (default: 30s)
eureka.client.registry-fetch-interval-seconds=30

# Cache refresh interval (default: 30s)
eureka.client.cache-refresh-executor-thread-pool-size=5

# How often to send heartbeat to Eureka server (default: 30s)
eureka.instance.lease-renewal-interval-in-seconds=30

# How long Eureka server waits before expiring instance (default: 90s)
eureka.instance.lease-expiration-duration-in-seconds=90

# Enable/disable health check (default: true)
eureka.client.healthcheck.enabled=true

# Swagger config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Logging
logging.level.com.craft.{service-name}=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
